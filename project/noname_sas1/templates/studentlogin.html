<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — Smart Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static',filename='attendance.css')}}">
</head>
<body>
<div class="card">
    <div class="icon-box">🧑‍🎓</div>
    <div class="role-label">Student Portal</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to view your attendance records</p>

    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/student-login">
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" name="student_id" placeholder="e.g. 2310010" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="login-btn">Sign In →</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>
</div>
</body>
</html>
