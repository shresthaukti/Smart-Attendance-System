<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Messages — Smart Attendance</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='attendance.css') }}"><style>
.chat-layout{max-width:1120px;margin:auto}.chat-shell{display:grid;grid-template-columns:310px 1fr;min-height:600px;background:rgba(255,255,255,.64);border:1px solid rgba(120,130,120,.16);border-radius:16px;overflow:hidden}.inbox{border-right:1px solid rgba(120,130,120,.16);padding:15px}.inbox h2{margin:0 0 10px;color:#46524a;font-size:16px}.filter,.search{box-sizing:border-box;width:100%;border:1px solid rgba(120,130,120,.25);border-radius:9px;padding:9px;font:12px Poppins;margin-bottom:8px}.conversation{width:100%;border:0;border-radius:10px;background:#fff;margin:4px 0;padding:11px;text-align:left;font:12px Poppins;color:#46524a;cursor:pointer}.conversation.unread{background:#dcefdc}.conversation.active{outline:2px solid #8faa94}.conversation strong,.conversation small{display:block}.conversation small{opacity:.65}.dot{float:right;background:#55835e;color:#fff;border-radius:10px;min-width:17px;text-align:center}.thread{display:flex;flex-direction:column;min-width:0}.thread-head{padding:16px 20px;border-bottom:1px solid rgba(120,130,120,.16);font-size:14px;font-weight:600;color:#46524a}.thread-head small{display:block;font-weight:400;font-size:11px;opacity:.65}.messages{flex:1;height:420px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.28)}.message{max-width:75%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap}.student{align-self:flex-start;background:#fff;color:#394550}.teacher{align-self:flex-end;background:#a8c3b0;color:#253c2b}.unsent{opacity:.6;font-style:italic}.message small{display:block;font-size:10px;opacity:.65;margin-top:4px}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(120,130,120,.16)}.composer textarea{flex:1;resize:none;min-height:44px;border:1px solid rgba(120,130,120,.25);border-radius:10px;padding:9px;font:13px Poppins}.send-btn,.nav-chat{border:0;border-radius:10px;padding:9px 16px;background:#8faa94;color:#fff;font:600 12px Poppins;cursor:pointer;text-decoration:none}.nav-chat{background:rgba(142,168,145,.2);color:#46524a}@media(max-width:700px){.chat-shell{grid-template-columns:1fr}.inbox{border-right:0;border-bottom:1px solid rgba(120,130,120,.16)}.messages{height:330px}.conversation{display:inline-block;width:48%;vertical-align:top;margin-right:1%}}
</style></head><body class="dashboard"><nav class="navbar"><div class="nav-brand"><div class="nav-logo">📋</div><div class="nav-title">Smart Attendance<span>Kathmandu University</span></div></div><div class="nav-right"><a class="nav-chat" href="/teacher-dashboard">Dashboard</a><span class="teacher-badge">👨‍🏫 {{ teacher_name }}</span><a href="/teacher-logout" class="logout-btn">← Logout</a></div></nav><main class="main chat-layout"><div class="page-header"><h1>Student messages</h1><p>Open one student conversation to read and reply privately.</p></div><section class="chat-shell"><aside class="inbox"><h2>Inbox</h2><select id="subject" class="filter" onchange="loadConversations()"><option value="">All classes</option>{% for subject in subjects %}<option value="{{ subject.subject_id }}">{{ subject.subject_id }} — {{ subject.subject_name }}</option>{% endfor %}</select><input id="search" class="search" placeholder="Search student" oninput="renderConversations()"><div id="conversations"></div></aside><section class="thread"><div id="threadHead" class="thread-head">Choose a student<small>Unread conversations are green.</small></div><div id="messages" class="messages"><p>Select a student from the inbox.</p></div><div class="composer"><textarea id="body" maxlength="1000" placeholder="Write a reply…" disabled></textarea><button id="send" class="send-btn" onclick="reply()" disabled>Reply</button></div></section></section></main><script>
let conversations=[],selected=null;const list=document.getElementById('conversations'),messages=document.getElementById('messages'),body=document.getElementById('body');function esc(v){const e=document.createElement('span');e.textContent=v||'';return e.innerHTML}async function loadConversations(){const sub=document.getElementById('subject').value;conversations=await fetch('/api/chat/teacher/conversations'+(sub?'?subject='+encodeURIComponent(sub):'')).then(r=>r.json());if(selected&&!conversations.some(c=>c.student_id===selected.student_id&&c.subject_id===selected.subject_id))selected=null;if(!selected&&conversations.length)selected=conversations[0];renderConversations();if(selected)loadMessages()}function renderConversations(){const q=document.getElementById('search').value.toLowerCase();list.innerHTML=conversations.filter(c=>(c.student_name+' '+c.subject_id).toLowerCase().includes(q)).map(c=>`<button class="conversation ${c.unread_count?'unread':''} ${selected&&selected.student_id===c.student_id&&selected.subject_id===c.subject_id?'active':''}" onclick="selectConversation('${esc(c.student_id)}','${esc(c.subject_id)}')"><strong>${esc(c.student_name)} ${c.unread_count?`<span class="dot">${c.unread_count}</span>`:''}</strong><small>${esc(c.subject_id)}</small></button>`).join('')||'<small>No conversations found.</small>'}function selectConversation(studentId,subjectId){selected=conversations.find(c=>c.student_id===studentId&&c.subject_id===subjectId);renderConversations();loadMessages()}async function loadMessages(){if(!selected)return;document.getElementById('threadHead').innerHTML=esc(selected.student_name)+`<small>${esc(selected.subject_id)}</small>`;body.disabled=false;document.getElementById('send').disabled=false;const q='?student_id='+encodeURIComponent(selected.student_id)+'&subject='+encodeURIComponent(selected.subject_id);const data=await fetch('/api/chat/teacher/messages'+q).then(r=>r.json());messages.innerHTML=data.map(m=>`<div class="message ${m.sender_role} ${m.unsent_at?'unsent':''}">${esc(m.body)}<small>${m.sender_role==='student'?esc(selected.student_name):'You'} · ${esc(m.created_at)}</small></div>`).join('')||'<p>No messages yet.</p>';messages.scrollTop=messages.scrollHeight;selected.unread_count=0;renderConversations()}async function reply(){const text=body.value.trim();if(!selected||!text)return;const d=await fetch('/api/chat/teacher/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:selected.student_id,subject_id:selected.subject_id,body:text})}).then(r=>r.json());if(!d.ok)return alert(d.message||'Could not send reply.');body.value='';loadMessages();loadConversations()}loadConversations();setInterval(loadConversations,10000);
</script></body></html>
